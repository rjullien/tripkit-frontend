<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Juju's Adventures">
  <meta name="theme-color" content="#0d1117">
  <title>Juju's Adventures</title>
  <link rel="icon" type="image/svg+xml" href="icons/juju-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v3.png">
  <link rel="manifest" href="manifest.json?v=4">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="apple-touch-icon" href="icons/icon-192-v3.png">
</head>
<body>

  <!-- ── Tab Views ──────────────────────────────────────────────────── -->
  <div id="tab-programme" class="tab-view active">
    <div class="page" id="programme-content"></div>
  </div>
  <div id="tab-route" class="tab-view">
    <div class="page" id="route-content"></div>
  </div>
  <div id="tab-culture" class="tab-view">
    <div class="page" id="culture-content"></div>
  </div>
  <div id="tab-hotels" class="tab-view">
    <div class="page" id="hotels-content"></div>
  </div>
  <div id="tab-construction" class="tab-view">
    <div class="page" id="construction-content"></div>
  </div>
  <div id="tab-plus" class="tab-view">
    <div class="page" id="plus-content"></div>
  </div>

  <!-- ── Bottom Navigation (5 tabs) ─────────────────────────────────── -->
  <nav class="bottom-nav" id="bottom-nav">
    <button data-tab="programme" class="active" onclick="App.switchTab('programme')">
      <span class="nav-icon">📅</span>
      Jour
    </button>
    <button data-tab="route" onclick="App.switchTab('route')">
      <span class="nav-icon">🗺️</span>
      Route
    </button>
    <button data-tab="culture" onclick="App.switchTab('culture')">
      <span class="nav-icon">📚</span>
      Culture
    </button>
    <button data-tab="hotels" onclick="App.switchTab('hotels')">
      <span class="nav-icon">📋</span>
      Résa
    </button>
    <button data-tab="construction" id="nav-construction" onclick="App.switchTab('construction')" style="display:none">
      <span class="nav-icon">🏗️</span>
      Constr.
    </button>
    <button data-tab="plus" onclick="App.switchTab('plus')">
      <span class="nav-icon">⚙️</span>
      Plus
    </button>
  </nav>

  <!-- ── Toast container ───────────────────────────────────────────── -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <!-- ── Scripts ────────────────────────────────────────────────────── -->
  <!-- Les trois bundles sont générés par scripts/build-bundles.mjs à partir de
       bundles.json (`npm run build`, aussi exécuté dans le Dockerfile) : les 34
       sources de js/ y sont concaténées dans l'ordre, sans minification.
       config.js reste une requête à part : il est généré au démarrage du
       conteneur par docker-entrypoint.sh (envsubst config.js.template).
       `defer` est sûr : chaque module ne touche les autres globales qu'au moment
       de l'appel, et app.js démarre sur DOMContentLoaded, qui n'est émis
       qu'après l'exécution de tous les scripts différés.
       js/dist/bundle-edge.js n'est PAS référencé ici : il est injecté à la
       demande par App au premier rendu de Plus ou Construction (voir
       ensureEdgeBundle dans js/app.js). Il reste précaché par le service worker. -->
  <script defer src="config.js"></script>
  <script defer src="js/dist/bundle-core.js"></script>
  <script defer src="js/dist/bundle-components.js"></script>

</body>
</html>
