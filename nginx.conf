server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression — the app shell is ~450 Ko uncompressed (28 <script> tags,
    # theme.css 43 Ko). gzip brings it to ~120 Ko on the wire. Level 5 is the
    # sweet spot for text on a small VPS; images/fonts/gguf are already packed
    # and are excluded by gzip_types.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: keep unpkg (Leaflet in mapHtml/meteoHtml blob iframes inherit this policy)
    # and weather APIs used by route-view.js / weather.js. Do NOT "tighten" these away.
    # Edge model (Wllama): HuggingFace GGUF download + optional jsDelivr compat worker on iOS.
    # 'wasm-unsafe-eval' is REQUIRED: without it Chrome/Safari refuse WebAssembly.instantiate()
    # inside the Wllama blob worker, which silently hangs activation until our own timeout.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://unpkg.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; connect-src 'self' https://api.open-meteo.com https://api.weather.gov https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.cdn.hf.co https://cdn.jsdelivr.net; frame-src 'self' blob:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Léo SSE — must not buffer; long tool phases rely on keepalive comments.
    location = /api/leo/chat/stream {
        proxy_pass http://tripkit-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://tripkit-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SECURITY: these identity headers are TRUSTED by the backend. They must
        # be set exclusively by Authelia (via Traefik authResponseHeaders) and
        # any client-supplied Remote-* header MUST be stripped upstream by the
        # `strip-remote-headers` Traefik middleware before forwardAuth. Do not
        # expose this service outside the Authelia-protected ingress.
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;

        # Prevent Cloudflare/browser from caching API responses (trip data is versioned client-side)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    location /health {
        proxy_pass http://tripkit-backend:3001;
    }

    # GGUF edge models (self-hosted smoke-test) — long cache OK (versioned by path/release)
    location ~* \.gguf$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Content-Type "application/octet-stream" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker — NEVER cache (browser must always check for updates)
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # version.json — NEVER cache (used for update detection)
    location = /version.json {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # manifest.json — short cache to pick up icon changes
    location = /manifest.json {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }

    # JS/CSS — short cache, must revalidate (SW handles offline caching)
    location ~* \.(js|css)$ {
        expires 5m;
        add_header Cache-Control "public, no-transform, must-revalidate";
    }

    # Images/fonts — long cache OK (rarely change)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
